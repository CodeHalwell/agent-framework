name: Sync with upstream

# Keeps this fork's main level with microsoft/agent-framework.
#
# The sync goes through the fork-sync API (`POST /repos/{owner}/{repo}/
# merge-upstream`) rather than a git merge and push, because GITHUB_TOKEN
# cannot push a commit that touches `.github/workflows/**` — the `workflow`
# scope that permits it exists only on PATs and GitHub Apps, and there is no
# `permissions:` key that grants it to GITHUB_TOKEN. That is what broke the
# scheduled sync on 2026-08-21..24, whenever upstream touched a workflow
# file. (Declaring `workflows: write` in `permissions:` then made things
# worse: it is not a valid permission key, so the file itself became invalid
# and every run failed at startup, scheduled runs included.)
#
# `merge-upstream` is what the repository's own "Sync fork" button calls. The
# merge happens server-side, on the repository's behalf rather than as a
# token push, so workflow files come across like any other file.
#
# The endpoint syncs a branch of this fork from the *parent* repository's
# branch of the same name, which is why there are no upstream_repo /
# upstream_branch inputs any more: they had nowhere to go. Syncing from
# somewhere other than microsoft/agent-framework:main means changing the
# fork's parent, not this file.

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch of this fork to update (synced from the parent repo branch of the same name)'
        required: false
        default: 'main'

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    steps:
      - name: Sync from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
        run: |
          set -euo pipefail

          # 409 is the one case a human is genuinely needed for: upstream and
          # the fork changed the same lines. Anything else non-2xx is a real
          # failure too, so the body is reported either way and the step fails
          # rather than passing quietly on a sync that did not happen.
          status=0
          response="$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/merge-upstream" \
            -f "branch=${TARGET_BRANCH}" 2>&1)" || status=$?

          echo "${response}"

          if [ "${status}" -ne 0 ]; then
            if printf '%s' "${response}" | grep -q 'HTTP 409'; then
              echo "::error::Merge conflict syncing ${TARGET_BRANCH} from upstream; resolve manually (GitHub's Sync fork button reports the same conflict)."
            else
              echo "::error::Failed to sync ${TARGET_BRANCH} from upstream."
            fi
            exit 1
          fi

          # merge_type is one of: merge | fast-forward | none.
          merge_type="$(printf '%s' "${response}" | jq -r '.merge_type // "unknown"')"
          echo "merge_type=${merge_type}"
          echo "Synced ${TARGET_BRANCH} from upstream (${merge_type})." >> "$GITHUB_STEP_SUMMARY"
