name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository to sync from (owner/repo)'
        required: false
        default: 'microsoft/agent-framework'
      upstream_branch:
        description: 'Upstream branch to sync from'
        required: false
        default: 'main'
      target_branch:
        description: 'Local branch to update'
        required: false
        default: 'main'

permissions:
  contents: write
  workflows: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch || 'main' }}

      - name: Add upstream remote
        env:
          UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || 'microsoft/agent-framework' }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream

      - name: Check if sync is needed
        id: check
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
        run: |
          LOCAL_SHA="$(git rev-parse HEAD)"
          UPSTREAM_SHA="$(git rev-parse upstream/${UPSTREAM_BRANCH})"
          echo "local_sha=${LOCAL_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          # `mode` is one of: up-to-date | fast-forward | merge.
          #
          # Fork-local commits (this workflow file among them) live on the
          # target branch, so the branch is permanently *not* an ancestor of
          # upstream and a fast-forward can never apply again. That is the
          # ordinary steady state for a fork that carries anything of its own,
          # not an error — so it merges rather than failing.
          if [ "${LOCAL_SHA}" = "${UPSTREAM_SHA}" ]; then
            echo "mode=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream/${UPSTREAM_BRANCH}."
          elif git merge-base --is-ancestor "${LOCAL_SHA}" "${UPSTREAM_SHA}"; then
            echo "mode=fast-forward" >> "$GITHUB_OUTPUT"
            echo "Fast-forward possible: ${LOCAL_SHA} -> ${UPSTREAM_SHA}"
          else
            echo "mode=merge" >> "$GITHUB_OUTPUT"
            echo "Local branch carries commits of its own; merging upstream in."
          fi

      - name: Fast-forward to upstream
        if: steps.check.outputs.mode == 'fast-forward'
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
        run: |
          git merge --ff-only "upstream/${UPSTREAM_BRANCH}"
          git push origin "${TARGET_BRANCH}"

      - name: Merge upstream into the fork
        if: steps.check.outputs.mode == 'merge'
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A conflict is the one case a human is genuinely needed for: it means
          # upstream and the fork changed the same lines. Abort so the branch is
          # left untouched, and report which paths collided.
          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::Merge conflict with upstream/${UPSTREAM_BRANCH}; resolve manually."
            git diff --name-only --diff-filter=U | sed 's/^/  conflicted: /'
            git merge --abort
            exit 1
          fi

          git push origin "${TARGET_BRANCH}"
